{% extends "base.html" %}
{% block title %}Edit Product - Virumart{% endblock %}
{% block content %}
<h2 class="section-title">Edit Product</h2>

<div class="card shadow-sm" style="max-width: 500px;">
  <div class="card-body">
    {% if product['image_path'] %}
    <img src="{{ url_for('static', filename='images/' + product['image_path']) }}" alt="{{ product['name'] }}" class="mb-3" style="width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px;">
    {% endif %}
    <form method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label">Product Name</label>
        <input type="text" name="name" class="form-control" value="{{ product['name'] }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Category</label>
        <input type="text" name="category" class="form-control" value="{{ product['category'] }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Cost Price (Rs.)</label>
        <input type="number" step="0.01" name="cost_price" class="form-control" value="{{ product['cost_price'] }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Selling Price (Rs.)</label>
        <input type="number" step="0.01" name="selling_price" class="form-control" value="{{ product['selling_price'] }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Quantity in Stock</label>
        <input type="number" name="quantity_in_stock" class="form-control" value="{{ product['quantity_in_stock'] }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Reorder Threshold</label>
        <input type="number" name="reorder_threshold" class="form-control" value="{{ product['reorder_threshold'] }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Replace Photo (optional)</label>
        <input type="file" name="image" class="form-control" accept=".jpg,.jpeg,.png,.webp">
      </div>
      <button type="submit" class="btn btn-add-cart">Save Changes</button>
      <a href="{{ url_for('admin.products') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
