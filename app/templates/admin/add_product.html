{% extends "base.html" %}
{% block title %}Add Product - Virumart{% endblock %}
{% block content %}
<h2 class="section-title">Add New Product</h2>

<div class="card shadow-sm" style="max-width: 500px;">
  <div class="card-body">
    <form method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label">Product Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Category</label>
        <input type="text" name="category" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Cost Price (Rs.)</label>
        <input type="number" step="0.01" name="cost_price" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Selling Price (Rs.)</label>
        <input type="number" step="0.01" name="selling_price" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Quantity in Stock</label>
        <input type="number" name="quantity_in_stock" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Reorder Threshold</label>
        <input type="number" name="reorder_threshold" class="form-control" value="5" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Product Photo (optional)</label>
        <input type="file" name="image" class="form-control" accept=".jpg,.jpeg,.png,.webp">
      </div>
      <button type="submit" class="btn btn-add-cart">Add Product</button>
      <a href="{{ url_for('admin.products') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
