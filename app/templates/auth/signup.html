{% extends "base.html" %}
{% block title %}Sign Up - Virumart{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 450px;">
  <div class="card-body">
    <h4 class="mb-3">Create Your Account</h4>
    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="tel" name="phone" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-add-cart w-100">Sign Up</button>
    </form>
    <p class="text-center small text-secondary mt-3">
      Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
