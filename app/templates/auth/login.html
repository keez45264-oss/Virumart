{% extends "base.html" %}
{% block title %}Log In - Virumart{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 450px;">
  <div class="card-body">
    <h4 class="mb-3">Log In</h4>
    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-add-cart w-100">Log In</button>
    </form>
    <p class="text-center small text-secondary mt-3">
      New here? <a href="{{ url_for('auth.signup') }}">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
